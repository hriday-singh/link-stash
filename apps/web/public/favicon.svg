<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    :root {
      --bg-stroke: #71717a;
      --tab-fill: #f4f4f5;
      --tab-stroke: #e4e4e7;
      --primary: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-stroke: #a1a1aa;
        --tab-fill: #27272a;
        --tab-stroke: #3f3f46;
        --primary: #818cf8;
      }
    }
  </style>
  <!-- Background card / shelf layer -->
  <rect x="3" y="5" width="18" height="15" rx="3" stroke="var(--bg-stroke)" stroke-width="1.5" />
  <!-- Middle card layer offset -->
  <path d="M6 3.5C6 2.67157 6.67157 2 7.5 2H16.5C17.3284 2 18 2.67157 18 3.5V5H6V3.5Z" fill="var(--tab-fill)" stroke="var(--tab-stroke)" stroke-width="1.2" />
  <!-- Foreground primary bookmark / stash ribbon -->
  <path d="M9 5V14L12 12.2L15 14V5H9Z" fill="var(--primary)" stroke="var(--primary)" stroke-width="1.2" stroke-linejoin="round" />
</svg>