[project]
name = "stash"
version = "1.0.0.11"
description = "Link Stash core: extract, triage and store saved links"
authors = [
    { name = "Hriday Singh", email = "hridaysingh2207@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.1.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scrapling[fetchers]>=0.4.15",
    "tomlkit>=0.13.0",
    "typer>=0.27.2",
    "uvicorn>=0.34.0",
    "watchfiles>=1.3.0",
]

[project.optional-dependencies]
# Speech transcript for the frames fallback (~150 MB + model on first use). See /stash-init.
whisper = ["faster-whisper>=1.2.0"]

[project.scripts]
stash = "stash.cli:app"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests as live integration tests (deselect with '-m \"not live\"')",
]
