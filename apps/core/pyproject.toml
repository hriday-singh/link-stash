[project]
name = "stash"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hriday Singh", email = "hridaysingh2207@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
stash = "stash:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
